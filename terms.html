<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拍教练 ShotCoach - 法律文档</title>
<style>
:root {
  --text: #1a1a1a;
  --text-secondary: #6b6b6b;
  --bg: #ffffff;
  --border: #e5e5e7;
  --link: #007AFF;
  --link-hover: #0051D5;
  --card-bg: #f7f7f8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --text: #ececec;
    --text-secondary: #9a9a9a;
    --bg: #1c1c1e;
    --border: #3a3a3c;
    --link: #0A84FF;
    --link-hover: #4DA9FF;
    --card-bg: #2c2c2e;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 16px;
  line-height: 1.6;
  color: var(--text);
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.container {
  max-width: 560px;
  margin: 0 auto;
  padding: 48px 24px;
  text-align: center;
}
h1 { font-size: 32px; font-weight: 700; margin: 0 0 8px; letter-spacing: -0.01em; }
.subtitle { color: var(--text-secondary); font-size: 16px; margin: 0 0 40px; }
.cards { display: grid; gap: 16px; margin-top: 32px; }
.card {
  display: block;
  padding: 24px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  text-decoration: none;
  color: var(--text);
  transition: transform 0.15s ease, border-color 0.15s ease;
  text-align: left;
}
.card:hover { transform: translateY(-2px); border-color: var(--link); }
.card-title { font-size: 18px; font-weight: 600; margin: 0 0 6px; color: var(--link); }
.card-desc { font-size: 14px; color: var(--text-secondary); margin: 0; }
.footer { margin-top: 56px; color: var(--text-secondary); font-size: 13px; }
.footer a { color: var(--link); text-decoration: none; }
.footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="container">
  <h1>拍教练 ShotCoach</h1>
  <p class="subtitle">法律文档与服务条款</p>

  <div class="cards">
    <a class="card" href="privacy/">
      <div class="card-title">隐私政策</div>
      <p class="card-desc">我们如何收集、使用和保护您的个人信息</p>
    </a>
    <a class="card" href="terms/">
      <div class="card-title">订阅服务条款</div>
      <p class="card-desc">PRO 会员订阅的使用规则、价格、续订与取消</p>
    </a>
  </div>

  <div class="footer">
    <p>联系我们:<a href="mailto:support@shotcoach.top">support@shotcoach.top</a></p>
  </div>
</div>
</body>
</html>
